# GovAI AI platform: the knowledge service (RAG) and the agent service.
#
# Use it together with the root docker-compose.yml (ChromaDB, SeaweedFS, network),
# from the repository root (all commands: ai-platform/README.md):
#
#   $env:COMPOSE_FILE = "docker-compose.yml;ai-platform/docker-compose.ai.yml"
#   docker compose up -d --build knowledge-service agent-chat
#   docker compose up -d --build knowledge-service agent-api   # chat API for core-service
#
# Compose resolves every path from the folder of the first -f file, so the paths
# below start at the repository root.
#
# Clients reach only the agent (the Chainlit chat, or LangGraph Studio with the
# "studio" profile). Citizens reach agent-api only through core-service, which
# checks their login first. The knowledge service has no published port: only the
# agent can call it, inside govai-network.

services:
  knowledge-service:
    build: ./ai-platform/services/knowledge-service/rag
    image: govai-knowledge-service
    container_name: govai-knowledge-service
    restart: unless-stopped
    env_file: ./ai-platform/services/knowledge-service/rag/.env
    environment:
      # Docker service names replace the localhost addresses in rag/.env
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
    expose:
      - "8020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - chromadb
      - seaweedfs
    networks:
      - govai-network

  agent-chat:
    build: ./ai-platform/services/agent-service
    image: govai-agent-service
    container_name: govai-agent-chat
    restart: unless-stopped
    env_file: ./ai-platform/services/agent-service/.env
    environment:
      # The knowledge service by its Docker service name
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8020
    ports:
      - "127.0.0.1:${AGENT_CHAT_PORT:-8502}:8502" # Chainlit chat
    depends_on:
      knowledge-service:
        condition: service_healthy
    networks:
      - govai-network

  agent-api:
    build: ./ai-platform/services/agent-service
    image: govai-agent-service
    container_name: govai-agent-api
    restart: unless-stopped
    # HTTPS with the local development certificate (infrastructure/keycloak/HTTPS-SETUP.md),
    # so core-service can send its service token; it trusts the same local CA (ca.pem)
    command:
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8030"
      - --ssl-certfile
      - /tls/api-cert.pem
      - --ssl-keyfile
      - /tls/api-key.pem
      - --no-server-header
    env_file: ./ai-platform/services/agent-service/.env
    environment:
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8020
    volumes:
      # Only the API certificate and key, read-only; nothing else from the tls folder
      - ./infrastructure/keycloak/tls/api-cert.pem:/tls/api-cert.pem:ro
      - ./infrastructure/keycloak/tls/api-key.pem:/tls/api-key.pem:ro
    ports:
      # core-service runs on the host and calls https://127.0.0.1:8030/api/v1/chat
      - "127.0.0.1:${AGENT_API_PORT:-8030}:8030"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8030/health', timeout=3, context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      knowledge-service:
        condition: service_healthy
    networks:
      - govai-network

  agent-studio:
    build: ./ai-platform/services/agent-service
    image: govai-agent-service
    container_name: govai-agent-studio
    restart: unless-stopped
    # Started only with: --profile studio
    profiles:
      - studio
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "2024", "--no-browser", "--no-reload"]
    env_file: ./ai-platform/services/agent-service/.env
    environment:
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8020
    ports:
      - "127.0.0.1:${AGENT_STUDIO_PORT:-2024}:2024" # LangGraph dev server for LangGraph Studio
    depends_on:
      knowledge-service:
        condition: service_healthy
    networks:
      - govai-network
