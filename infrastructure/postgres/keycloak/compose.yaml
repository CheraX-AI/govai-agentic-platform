name: govai-keycloak-db
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: govai_keycloak
      POSTGRES_PASSWORD: admin
    volumes:
      - ${DATA_DIR:-/srv/govai/data}/keycloak-postgres:/var/lib/postgresql/data
    networks:
      keycloak_private:
        aliases:
          - keycloak-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d govai_keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
networks:
  keycloak_private:
    name: govai-keycloak-dbnet
    internal: true
