name: govai-keycloak-db
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_USER: govai_kc_bootstrap
      POSTGRES_DB: govai_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_BOOTSTRAP_PASSWORD:?Run setup.ps1 first}
      KEYCLOAK_DB_APP_PASSWORD: ${KEYCLOAK_DB_APP_PASSWORD:?Run setup.ps1 first}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
      - ./init-keycloak.sh:/docker-entrypoint-initdb.d/010-keycloak.sh:ro
    networks:
      keycloak_private:
        aliases:
          - keycloak-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govai_kc_bootstrap -d govai_keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  keycloak_postgres_data:
networks:
  keycloak_private:
    name: govai-keycloak-dbnet
    internal: true
