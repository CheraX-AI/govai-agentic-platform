services:
  postgres:
    image: postgres:16
    container_name: govai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - govai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: govai-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - govai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: govai-seaweedfs
    restart: unless-stopped
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
    # Write the S3 credentials file from the environment, then start SeaweedFS
    # with the master (9333), filer (8888) and S3 API (8333)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"govai","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -master.port=9333 -filer -filer.port=8888 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT}:8333" # S3 API
      - "127.0.0.1:8888:8888" # Filer UI
      - "127.0.0.1:9333:9333" # Master UI
    volumes:
      - seaweedfs_data:/data
    networks:
      - govai-network

  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    container_name: govai-seaweedfs-admin
    restart: unless-stopped
    environment:
      SEAWEEDFS_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?Set SEAWEEDFS_ADMIN_PASSWORD in .env}
    # Web admin UI (23646): cluster overview, buckets, file browser, volumes, maintenance.
    # Login is "admin" with the password from .env; it finds the filer through the master.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec weed admin -port=23646 -port.legacy=0 -master=seaweedfs:9333 -dataDir=/data -adminPassword="$$SEAWEEDFS_ADMIN_PASSWORD"
    ports:
      - "127.0.0.1:23646:23646" # Admin UI
    volumes:
      - seaweedfs_admin_data:/data
    depends_on:
      - seaweedfs
    networks:
      - govai-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: govai-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMA_PORT:?Set CHROMA_PORT in .env}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - govai-network

  chromadb-dashboard:
    build: ./infrastructure/chromadb/dashboard
    container_name: govai-chromadb-dashboard
    restart: unless-stopped
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "8501:8501"
    depends_on:
      - chromadb
    networks:
      - govai-network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: govai-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - govai-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: govai-redisinsight
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - govai-network

  # ---------------------------------------------------------------------------
  # Web app on https://localhost:5173 (the origin auth-service accepts).
  # The browser calls the auth API on the host (https://localhost:5001).
  # Only one of web / web-prod / `npm run dev` can use port 5173 at a time.
  # ---------------------------------------------------------------------------

  # Development: Vite dev server with live reload (starts with `docker compose up -d`)
  web:
    build:
      context: ./app/web
      target: dev
    image: govai-web-dev
    container_name: govai-web
    restart: unless-stopped
    environment:
      VITE_WATCH_POLLING: "true"
    volumes:
      # Source for live reload (read-only); dependencies stay inside the image
      - ./app/web/src:/app/web/src:ro
      - ./app/web/public:/app/web/public:ro
      - ./app/web/index.html:/app/web/index.html:ro
      # vite.config.ts reads ../../infrastructure/keycloak/tls from /app/web
      - ./infrastructure/keycloak/tls/api-cert.pem:/infrastructure/keycloak/tls/api-cert.pem:ro
      - ./infrastructure/keycloak/tls/api-key.pem:/infrastructure/keycloak/tls/api-key.pem:ro
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - govai-network

  # Production build served by nginx. Start with:
  #   docker compose stop web
  #   docker compose --profile prod up -d --build web-prod
  web-prod:
    build:
      context: ./app/web
      target: prod
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-https://localhost:5001}
    image: govai-web-prod
    container_name: govai-web-prod
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - ./infrastructure/keycloak/tls/api-cert.pem:/etc/nginx/tls/api-cert.pem:ro
      - ./infrastructure/keycloak/tls/api-key.pem:/etc/nginx/tls/api-key.pem:ro
    ports:
      - "127.0.0.1:5173:8443"
    networks:
      - govai-network

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  seaweedfs_admin_data:
  chroma_data:
  pgadmin_data:
  redisinsight_data:

networks:
  govai-network:
    driver: bridge
    