services:
  postgres:
    image: postgres:16
    container_name: govai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - govai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: govai-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - govai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: govai-seaweedfs
    restart: unless-stopped
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
    # Write the S3 credentials file from the environment, then start SeaweedFS
    # with the master (9333), filer (8888) and S3 API (8333)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"govai","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -master.port=9333 -filer -filer.port=8888 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT}:8333" # S3 API
      - "127.0.0.1:8888:8888" # Filer UI
      - "127.0.0.1:9333:9333" # Master UI
    volumes:
      - seaweedfs_data:/data
    networks:
      - govai-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: govai-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMA_PORT:?Set CHROMA_PORT in .env}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - govai-network

  chromadb-dashboard:
    build: ./infrastructure/chromadb/dashboard
    container_name: govai-chromadb-dashboard
    restart: unless-stopped
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "8501:8501"
    depends_on:
      - chromadb
    networks:
      - govai-network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: govai-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - govai-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: govai-redisinsight
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - govai-network

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  chroma_data:
  pgadmin_data:
  redisinsight_data:

networks:
  govai-network:
    driver: bridge
    