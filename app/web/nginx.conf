# nginx for the production web image (Dockerfile target "prod").
# The certificate and key are mounted read-only at /etc/nginx/tls.

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/api-cert.pem;
    ssl_certificate_key /etc/nginx/tls/api-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # Built JS/CSS have a content hash in the file name, so they never change: cache for a year
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else: real files (images, fonts) or the app itself. Paths such as
    # /app/home or /login are app pages, so they get index.html (also on refresh).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
